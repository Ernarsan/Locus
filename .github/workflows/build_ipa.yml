name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Run Unit Tests
    runs-on: macos-15
    continue-on-error: true
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 📱 Select Xcode
        run: |
          for xcode in /Applications/Xcode_26*.app /Applications/Xcode_16*.app /Applications/Xcode*.app; do
            if [ -d "$xcode" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          swift -version

      - name: 📦 Install XcodeGen
        run: brew install xcodegen

      - name: ⚙️ Generate Xcode Project
        run: xcodegen generate

      - name: 🧪 Run Unit Tests on iOS Simulator
        continue-on-error: true
        run: |
          SIM_NAME="iPhone 16"
          if ! xcrun simctl list devices available | grep -q "iPhone 16"; then
            SIM_NAME=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | sed -E 's/^[ ]+//; s/ \([A-F0-9-]+\).*//')
          fi
          echo "Running tests on simulator: ${SIM_NAME:-iPhone 16}"
          xcodebuild test \
            -project Locus.xcodeproj \
            -scheme Locus \
            -destination "platform=iOS Simulator,name=${SIM_NAME:-iPhone 16}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  build-ipa:
    name: 📱 Build iOS IPA
    runs-on: macos-15
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 📱 Select Xcode
        run: |
          for xcode in /Applications/Xcode_26*.app /Applications/Xcode_16*.app /Applications/Xcode*.app; do
            if [ -d "$xcode" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          swift -version

      - name: 📦 Verify Vendor idevice FFI library
        run: |
          if [ ! -f "Vendor/idevice/libidevice_ffi.a" ]; then
            echo "::error::Vendor/idevice/libidevice_ffi.a is missing!"
            exit 1
          fi
          ls -lh Vendor/idevice/libidevice_ffi.a

      - name: 📦 Install XcodeGen
        run: brew install xcodegen

      - name: ⚙️ Generate Xcode Project
        run: xcodegen generate

      - name: 🔧 Patch project.pbxproj for Unsigned Build
        run: |
          node -e "
          const fs = require('fs');
          const pbxFile = 'Locus.xcodeproj/project.pbxproj';
          if (fs.existsSync(pbxFile)) {
            let pbx = fs.readFileSync(pbxFile, 'utf8');
            pbx = pbx.replace(/CODE_SIGN_STYLE = Automatic;/g, 'CODE_SIGN_STYLE = Manual;');
            pbx = pbx.replace(/ProvisioningStyle = Automatic;/g, 'ProvisioningStyle = Manual;');
            pbx = pbx.replace(/CODE_SIGNING_ALLOWED = YES;/g, 'CODE_SIGNING_ALLOWED = NO;');
            pbx = pbx.replace(/DevelopmentTeam = [^;]+;/g, 'DevelopmentTeam = \"\";');
            pbx = pbx.replace(/buildSettings = \{/g, 'buildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_IDENTITY = \"\";');
            fs.writeFileSync(pbxFile, pbx);
            console.log('✅ project.pbxproj successfully patched for manual unsigned build');
          }
          "

      - name: ⚙️ Build Archive via Xcode (Real iPhone ARM64)
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild archive \
            -project Locus.xcodeproj \
            -scheme Locus \
            -archivePath "build/Locus.xcarchive" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee xcode_build.log || {
              echo "### ❌ Xcode Build Error Log" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              tail -n 120 xcode_build.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            }

      - name: 📦 Package into Locus-Timer.ipa
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/Locus.xcarchive/Products/Applications -name "*.app" -type d | head -n 1)
          echo "Found .app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app not found in archive!"
            exit 1
          fi
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r Locus-Timer.ipa Payload
          cd ..
          echo "### 🎉 IPA Successfully Built" >> $GITHUB_STEP_SUMMARY
          ls -lh build/Locus-Timer.ipa

      - name: 🚀 Upload Locus-Timer.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Locus-Timer-ipa
          path: build/Locus-Timer.ipa
          retention-days: 14

      - name: 🌟 Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Locus-Timer v1.0.${{ github.run_number }}"
          body: "Готовый к установке iOS IPA файл Locus с таймером и фоновым режимом, собранный через GitHub Actions без платного аккаунта Apple."
          files: build/Locus-Timer.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-error-log
          path: xcode_build.log
